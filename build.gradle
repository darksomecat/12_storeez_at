plugins {
    id 'java-library'
    id("io.qameta.allure") version "4.1.0"
}

repositories {
    mavenCentral()
}

def aspectjWeaverVersion = "1.9.25",
    selenideVersion = "6.13.0",
    restAssuredVersion = "6.2.0",
    allureAdaptersVersion = "2.35.5",
    allureReportVersion = "2.46.1",
    junitVersion = "5.14.4",
    slf4jVersion = "2.0.20",
    appiumVersion = "8.3.0",
    ownerVersion = "1.0.12"

allure {
    version.set(allureReportVersion)
    adapter {
        allureJavaVersion.set(allureAdaptersVersion)
        aspectjWeaver.set(true)
        aspectjVersion.set(aspectjWeaverVersion)
    }
}

group = 'guru.qa'
version = '1.0-SNAPSHOT'

sourceSets {
    mobileTest
}

dependencies {
    implementation(
            "commons-io:commons-io:2.15.1",
            "io.qameta.allure:allure-java-commons:2.35.4",
            "org.junit.jupiter:junit-jupiter-api:5.14.2"
    )

    testImplementation (
            "com.codeborne:selenide:7.16.0",
            "io.rest-assured:rest-assured:6.2.0",
            "org.junit.jupiter:junit-jupiter:5.14.2",
            "com.github.javafaker:javafaker:1.0.2",
            "io.qameta.allure:allure-selenide:2.35.4",
            "org.aeonbits.owner:owner:1.0.12")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mobileTestImplementation(
            "org.aspectj:aspectjweaver:$aspectjWeaverVersion",
            "com.codeborne:selenide:$selenideVersion",
            "io.qameta.allure:allure-selenide:$allureAdaptersVersion",
            "io.appium:java-client:$appiumVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.aeonbits.owner:owner:$ownerVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion"
    )
    mobileTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        ("org.seleniumhq.selenium:selenium-java:4.45.0")
        ("org.seleniumhq.selenium:selenium-chrome-driver:4.45.0")
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat = "short"
        }
    }
}